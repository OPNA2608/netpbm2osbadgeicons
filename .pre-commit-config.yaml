repos:
- repo: local
  hooks:
  - id: clang-format
    name: clang-format
    language: system
    entry: clang-format -i
    types_or: [ c, header ]
  - id: editorconfig-checker
    name: editorconfig-checker
    language: system
    entry: editorconfig-checker
    types: [ text ]
  - id: nixfmt
    name: nixfmt
    language: system
    entry: nixfmt
    types: [ text ]
    files: '.*\.nix$'
